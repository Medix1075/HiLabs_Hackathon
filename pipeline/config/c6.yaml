# C6 configuration: build the provider rate file (deliverable 1).

# C4 keeps one rate per price variant. The rate file has one row per NPI x TIN x address x code,
# so one variant is the "headline" rate. The preference, in order (first difference decides):
headline:
  negotiated_type: [negotiated, fee schedule, derived, per diem, percentage]
  # Individuals (Type 1) bill professional claims; organisations (Type 2: hospitals, ASCs, labs)
  # bill institutional ones when both exist. Unknown type is treated as Type 1.
  billing_class:
    "1": [professional, institutional]
    "2": [institutional, professional]
  setting: [outpatient, both, inpatient, ""]
  preferred_pos: ["11"]            # office; a variant whose place-of-service list includes it is preferred
  prefer_no_modifier: true

specialty:
  infer_min_codes: 3               # inference from billed codes needs at least this many workbook codes
  infer_min_f: 0.25

excel:
  max_rows: 3000000                # beyond this the Excel stops and the CSV holds everything
  rows_per_sheet: 1000000          # Excel's limit is 1,048,576

# Which C4 network statuses go where (see config/c4.yaml). Deliverable 1 holds confirmed PPO rates only;
# the candidate file keeps the rest for review so nothing potentially useful is thrown away.
network:
  rate_file_statuses: [CONFIRMED_PPO]
  candidate_file_statuses: [PPO_CANDIDATE, UNRESOLVED]
  # c6_network_check_sample.csv: this many NPI-TIN pairs per status to look up by hand in the PPO
  # directory; `python -m ptd_c6 check-network` turns the filled-in sample into precision figures.
  check_sample_per_status: 30

# Optional PPO probability model (ptd_c6 run --ppo-model [c4_ppo_check.csv]; see ptd_c6/ppo_model.py).
# Positive-unlabelled: trained on the pairs searched on the payer's finder, listed = positive.
ppo_model:
  l2: 1.0                  # ridge penalty on the standardised coefficients
  folds: 5                 # cross-validation folds, grouped by TIN
  smoothing: 2.0           # pseudo-counts toward the overall listed share in the neighbour shares
  other_tin_weight: 0.5    # an NPI listed under another TIN counts as a half-weight positive for this pair
  min_region_pairs: 20     # regions with fewer pairs share the baseline
  min_c: 0.2               # floor for c = P(listed | PPO)
